services:
  - type: web
    name: digital-growth-studio-api
    env: python
    region: singapore
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: "production"
      - key: APP_NAME
        value: "Digital Growth Studio"
      - key: APP_VERSION
        value: "1.0.0"
      - key: DEBUG
        value: "false"
      - key: BACKEND_URL
        value: "https://digital-growth-studio-api.onrender.com"
      - key: FRONTEND_URL
        value: "https://digitalgrowthstudio.in"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:8000,https://digitalgrowthstudio.in,https://www.digitalgrowthstudio.in,https://digital-growth-studio.web.app,https://digital-growth-studio.firebaseapp.com,https://digital-growth-studio-api.onrender.com"
      - key: DATABASE_URL
        sync: true
      - key: FIREBASE_PROJECT_ID
        value: "digital-growth-studio"
      - key: FIREBASE_PRIVATE_KEY_PATH
        value: "./firebase-service-account.json"
      - key: ENCRYPTION_KEY
        sync: true
      - key: RAZORPAY_KEY_ID
        sync: true
      - key: RAZORPAY_KEY_SECRET
        sync: true
      - key: META_APP_ID
        value: "mock_meta_app_id"
      - key: META_APP_SECRET
        value: "mock_meta_app_secret"
      - key: META_REDIRECT_URI
        value: "https://digital-growth-studio-api.onrender.com/api/v1/meta/callback"
      - key: META_API_VERSION
        value: "v21.0"
      - key: SYNC_COOLDOWN_MINUTES
        value: "15"
      - key: INITIAL_SYNC_DAYS
        value: "30"


